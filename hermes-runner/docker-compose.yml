services:
  lisa:
    build:
      context: .
    container_name: runner-lisa
    restart: unless-stopped

    ports:
      - "2201:22"

    networks:
      - lisa_net

    volumes:
      - lisa_workspace:/workspace
      - lisa_hostkeys:/etc/ssh/hostkeys
      - ./ssh/authorized_keys:/config/authorized_keys:ro

networks:
  lisa_net:
    driver: bridge

volumes:
  lisa_workspace:
  lisa_hostkeys: